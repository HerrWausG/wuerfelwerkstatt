<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Längenwerkstatt – Üben und Test</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#eef4fa;color:#17324c}header{background:linear-gradient(115deg,#174a78,#087e93);color:white;padding:22px max(18px,calc((100vw - 950px)/2))}h1{margin:0;font-size:clamp(25px,4vw,36px)}header p{margin:6px 0}main{max-width:950px;margin:20px auto;padding:0 14px}.panel{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 4px 16px #1b3c5614}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{background:#17658c;color:white;border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:650;cursor:pointer;min-height:44px}button.secondary{background:#e6eef6;color:#174a78}button:disabled{opacity:.45}input,select{border:2px solid #b9cddd;border-radius:9px;padding:9px;font:inherit;min-height:43px}input[type=text]{width:105px}input.name{width:230px;max-width:100%}.task{border-top:1px solid #e3eaf0;padding:15px 0}.task p{font-weight:600;margin:0 0 10px}.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{font-size:14px;margin-top:6px}.good{color:#127344}.bad{color:#ad3030}.tablewrap{overflow-x:auto}table{border-collapse:collapse;margin:8px 0;width:100%;min-width:540px}th,td{border:1px solid #c6d5e1;padding:7px;text-align:center}th{background:#e7f1f7}td input{width:100%;min-width:42px;text-align:center;padding:6px}.muted{color:#5b6e80}.hidden{display:none!important}.score{font-size:22px;font-weight:750}.tag{font-size:13px;background:#e4f0f8;padding:5px 9px;border-radius:99px}#tasks h2{margin-top:25px} @media print{header,.noprint,button{display:none!important}body{background:white}.panel{box-shadow:none;border:1px solid #ddd}input{border:1px solid #777}}</style></head><body><header><h1>📏 Längenwerkstatt</h1><p>Stellenwerte · Umrechnen · Plus, Minus und Mal</p></header><main><section class="panel noprint"><div class="controls"><button id="practice">🔁 Übungsmodus</button><button id="test" class="secondary">📝 Testmodus</button><span class="tag" id="mode">Übungsmodus</span></div><p class="muted" id="intro">Bearbeite alle Aufgaben. Kontrolliere deine Antworten und starte danach eine neue Runde.</p><div class="controls"><label>Name: <input class="name" id="name" placeholder="Vor- und Nachname" autocomplete="name"></label><label>Schwierigkeit: <select id="difficulty"><option value="1">Leicht</option><option value="2" selected>Mittel</option><option value="3">Schwer</option></select></label></div></section><section class="panel"><div id="summary" class="hidden"></div><div id="tasks"></div><div class="controls noprint" style="margin-top:20px"><button id="check">Antworten kontrollieren</button><button id="new" class="secondary" disabled>🔁 Neue Aufgaben erstellen</button><button id="copy" class="secondary hidden">📋 Ergebnis kopieren</button><button id="print" class="secondary hidden">🖨️ Ergebnis drucken</button></div><p class="muted" id="footer">Alle Eingaben bleiben auf diesem Gerät. Es werden keine Daten an einen Server übertragen.</p></section></main><script>
'use strict';const $=id=>document.getElementById(id);let testMode=false,tasks=[],checked=false,attempts=0,round=0;const units=['km','100 m','10 m','m','dm','cm','mm'];const factors={km:1000000,m:1000,dm:100,cm:10,mm:1};const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[rnd(0,a.length-1)];const fmt=n=>String(n).replace('.',',');function digits(mm){let n=mm;return [1000000,100000,10000,1000,100,10,1].map(f=>{const d=Math.floor(n/f);n%=f;return d})}function maxNum(){return +$('difficulty').value}function generate(){round++;checked=false;attempts=0;$('summary').classList.add('hidden');$('copy').classList.add('hidden');$('print').classList.add('hidden');$('new').disabled=true;$('check').disabled=false;$('check').textContent=testMode?'Test abgeben':'Antworten kontrollieren';const level=maxNum();tasks=[];let count=0;const add=(group,prompt,answer,kind='text',extra={})=>tasks.push({id:count++,group,prompt,answer,kind,...extra});
// Stellenwertaufgaben: nur ganze Millimeter, eindeutig sieben Ziffern.
for(let i=0;i<(testMode?5:4);i++){let km=level===1?0:rnd(0,level===3?3:1),m=rnd(1,level===1?99:999),dm=rnd(0,9),cm=rnd(0,9),mm=rnd(0,9);let total=km*1000000+m*1000+dm*100+cm*10+mm;let prompt=(km?km+' km ':'')+m+' m '+dm+' dm '+cm+' cm '+mm+' mm';add('1. Stellenwerttabelle','Trage '+prompt+' in die Stellenwerttabelle ein.',digits(total),'table')}
const choices=level===1?[['m','cm'],['cm','mm'],['m','mm'],['km','m']]:[['m','cm'],['cm','mm'],['m','mm'],['km','m'],['dm','cm'],['cm','dm'],['mm','cm'],['m','dm']];for(let i=0;i<(testMode?6:5);i++){let [from,to]=pick(choices);let n=rnd(2,level===1?25:level===2?125:400);let v=n*factors[from]/factors[to];if(!Number.isInteger(v)) {n=Math.ceil(n*10)*10;v=n*factors[from]/factors[to]}add('2. Längen umrechnen',`${n} ${from} = ? ${to}`,v,'text',{unit:to})}
for(let i=0;i<(testMode?6:5);i++){let unit=pick(level===1?['m','cm']:['m','cm','mm','dm']);let a=rnd(2,level===3?450:95),b=rnd(2,level===3?120:45),op=['+','−','×'][i%3];if(op==='−'&&b>a)[a,b]=[b,a];if(op==='×')b=rnd(2,level===3?12:7);let answer=op==='+'?a+b:op==='−'?a-b:a*b;add('3. Mit Längen rechnen',`${a} ${unit} ${op} ${b}${op==='×'?'':' '+unit} = ? ${unit}`,answer,'text',{unit})}
for(let i=0;i<(testMode?3:3);i++){let a=rnd(1,level===3?18:8),b=rnd(2,level===3?95:45),op=i===1?'−':i===2?'×':'+';let result=op==='+'?a*100+b:op==='−'?a*100-b:a*b*100;add('4. Gemischte Einheiten',op==='×'?`${a} m × ${b} = ? cm`:`${a} m ${op} ${b} cm = ? cm`,result,'text',{unit:'cm'})}

render()}
function render(){let html='',group='';tasks.forEach(t=>{if(t.group!==group){group=t.group;html+=`<h2>${group}</h2>`}html+=`<div class="task" data-task="${t.id}"><p>${t.id+1}. ${t.prompt}</p>`;if(t.kind==='table'){html+='<div class="tablewrap"><table><thead><tr>'+units.map(u=>`<th>${u}</th>`).join('')+'</tr></thead><tbody><tr>'+units.map((u,j)=>`<td><input type="text" inputmode="numeric" maxlength="1" aria-label="${u}" data-digit="${j}" autocomplete="off"></td>`).join('')+'</tr></tbody></table></div>'}else{html+=`<div class="answer"><input type="text" inputmode="decimal" aria-label="Antwort Aufgabe ${t.id+1}" autocomplete="off"><span>${t.unit||''}</span></div>`}html+='<div class="status" aria-live="polite"></div></div>'});$('tasks').innerHTML=html;$('mode').textContent=testMode?'Testmodus · 20 Aufgaben':'Übungsmodus · '+tasks.length+' Aufgaben';$('intro').textContent=testMode?'Keine Hinweise während des Tests. Nach der Abgabe werden Punkte und Note angezeigt.':'Nach der Kontrolle kannst du Fehler verbessern. Sind alle Aufgaben richtig, kannst du neue Aufgaben erzeugen.'}
function value(t,el){if(t.kind==='table'){return [...el.querySelectorAll('[data-digit]')].map(x=>x.value.trim())}let s=el.querySelector('input').value.trim().replace(',','.').replace(/\s/g,'');return s===''?NaN:Number(s)}function correct(t,v){return t.kind==='table'?v.length===7&&v.every((x,i)=>/^\d$/.test(x)&&Number(x)===t.answer[i]):Number.isFinite(v)&&Math.abs(v-t.answer)<1e-8}function solution(t){return t.kind==='table'?t.answer.join(' | '):fmt(t.answer)+' '+(t.unit||'')}
function check(){if(testMode&&checked)return;attempts++;let good=0;tasks.forEach(t=>{let el=document.querySelector(`[data-task="${t.id}"]`),v=value(t,el),ok=correct(t,v),status=el.querySelector('.status');if(ok)good++;if(testMode){status.textContent=ok?'✓ Richtig':'✗ Lösung: '+solution(t);status.className='status '+(ok?'good':'bad');el.querySelectorAll('input').forEach(x=>x.disabled=true)}else{status.textContent=ok?'✓ Richtig!':attempts===1?'Noch nicht richtig – versuche es erneut.':'Noch nicht richtig. Lösung: '+solution(t);status.className='status '+(ok?'good':'bad')}});let total=tasks.length;let all=good===total;if(testMode){checked=true;$('check').disabled=true;let pct=good/total*100;let note=pct>=95?1:pct>=80?2:pct>=65?3:pct>=50?4:pct>=25?5:6;let name=$('name').value.trim()||'Ohne Namen';$('summary').innerHTML=`<div class="score">Testergebnis: ${good} von ${total} Punkten (${Math.round(pct)} %)</div><p><b>Note (Vorschlag): ${note}</b> · Name: ${escapeHtml(name)}</p><p class="muted">Notenschlüssel: 1 ab 95 %, 2 ab 80 %, 3 ab 65 %, 4 ab 50 %, 5 ab 25 %, sonst 6. Anpassung an deinen schulischen Schlüssel möglich.</p>`;$('summary').classList.remove('hidden');$('copy').classList.remove('hidden');$('print').classList.remove('hidden');$('new').disabled=false;$('new').textContent='Neuen Test erstellen';$('new').classList.remove('hidden')}else{$('summary').innerHTML=`<div class="score">${good} von ${total} Aufgaben richtig ${all?'🎉':''}</div><p>${all?'Klasse! Du kannst jetzt neue Aufgaben erstellen.':'Verbessere die markierten Aufgaben und kontrolliere erneut.'}</p>`;$('summary').classList.remove('hidden');$('new').disabled=!all;$('new').textContent='🔁 Neue Aufgaben erstellen'}$('summary').scrollIntoView({behavior:'smooth',block:'center'})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setMode(t){testMode=t;$('test').className=t?'':'secondary';$('practice').className=t?'secondary':'';$('difficulty').disabled=t&&checked;generate()}$('practice').onclick=()=>setMode(false);$('test').onclick=()=>setMode(true);$('difficulty').onchange=generate;$('check').onclick=check;$('new').onclick=()=>{if(testMode){if(!confirm('Neuen Test beginnen? Das bisherige Ergebnis wird auf dieser Seite gelöscht.'))return}generate()};$('copy').onclick=async()=>{let score=tasks.filter(t=>correct(t,value(t,document.querySelector(`[data-task="${t.id}"]`)))).length;let s=`Mathe-Test Längen\nName: ${$('name').value||'Ohne Namen'}\nErgebnis: ${score}/${tasks.length} Punkte\nDatum: ${new Date().toLocaleDateString('de-DE')}`;try{await navigator.clipboard.writeText(s);$('copy').textContent='✓ Kopiert'}catch(e){prompt('Ergebnis kopieren:',s)}};$('print').onclick=()=>window.print();generate();
</script></body></html>
