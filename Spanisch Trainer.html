<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spanisch Trainer 10</title><style>body{font:17px system-ui;background:#f4f6fb;color:#17243b;margin:0}header{background:#19366c;color:white;padding:20px}main{max-width:850px;margin:auto;padding:18px}.tabs{display:flex;flex-wrap:wrap;gap:8px}button,select,input,textarea{font:inherit;border-radius:10px;padding:11px;border:1px solid #aab5c8}button{background:#e1e9fa;cursor:pointer}button.active,.primary{background:#2254a5;color:white}.card{background:white;padding:20px;border-radius:16px;margin-top:15px;box-shadow:0 2px 12px #142a4912}input,textarea{box-sizing:border-box;width:100%;margin:10px 0}textarea{min-height:100px}.muted{color:#53647b}.good{color:#137443}.bad{color:#b12737}.hidden{display:none}#feedback{white-space:pre-wrap}label{display:block;margin:10px 0}.stat{font-weight:700}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px;margin:12px 0}.topics label{display:flex;align-items:center;gap:8px;background:#f1f5fc;border:1px solid #dce5f2;padding:12px;border-radius:10px;margin:0}.topics input{width:20px;height:20px;margin:0;flex:none} </style><header><h1>🇪🇸 Spanisch-Trainer · Klasse 10</h1><div>Vokabeln · Subjuntivo · Übersetzen · Lesen · Hören</div></header><main><div class="tabs" id="tabs"></div><div class="card"><div><strong>1. Themen auswählen (mehrere möglich)</strong><p class="muted">Setze bei allen gewünschten Themen ein Häkchen. Die Aufgaben werden daraus gemischt.</p><div class="topics" id="topics"><label><input type="checkbox" value="photos" checked> 📷 Arbeitsblätter: Mobbing &amp; Subjuntivo</label><label><input type="checkbox" value="environment"> 🌿 Umwelt &amp; Klimawandel</label><label><input type="checkbox" value="social"> 📱 Soziale Medien &amp; Datenschutz</label><label><input type="checkbox" value="society"> 🌍 Gesellschaft &amp; Zusammenleben</label><label><input type="checkbox" value="travel"> ✈️ Reisen &amp; Alltag</label></div><div class="tabs"><button type="button" onclick="setTopics(true)">Alle auswählen</button><button type="button" onclick="setTopics(false)">Auswahl löschen</button></div></div><label>Übungsmodus <select id="mode"><option value="practice">Lernen mit Rückmeldung</option><option value="test">Test ohne sofortige Rückmeldung</option><option value="review">Meine Fehler gezielt üben</option></select></label><label>Aufgabenanzahl <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><p id="memoryStats" class="muted"></p><button class="primary" onclick="start()">Neue Runde starten</button><button type="button" onclick="clearMistakes()">Gespeicherte Fehler löschen</button></div><section class="card" id="work"><p>Wähle einen Lernbereich und starte eine Runde.</p></section></main><script>
const vocab=[['defender','verteidigen'],['ser','sein'],['querer','wollen'],['creer','glauben'],['conseguir','erreichen'],['someter','unterwerfen'],['sufrir','leiden'],['atacar','angreifen'],['saber','wissen'],['solucionar','lösen'],['quedarse','bleiben'],['aprender','lernen'],['pensar','denken'],['tratar','behandeln'],['emborracharse','sich betrinken'],['evitar','vermeiden'],['conducir','fahren'],['transformarse','sich verwandeln'],['decir','sagen'],['acosar','mobben'],['ocurrir','geschehen'],['olvidar','vergessen'],['tener miedo','Angst haben'],['pegar','schlagen'],['estar','sein/sich befinden'],['humillar','demütigen'],['insultar','beleidigen'],['ignorar','ignorieren'],['sentirse','sich fühlen'],['hacer daño','verletzen'],['impedir','verhindern'],['contar','erzählen'],['poder','können'],['merecer','verdienen'],['ayudar','helfen']];
const verbs={dar:['dé','des','dé','demos','deis','den'],estar:['esté','estés','esté','estemos','estéis','estén'],haber:['haya','hayas','haya','hayamos','hayáis','hayan'],ir:['vaya','vayas','vaya','vayamos','vayáis','vayan'],saber:['sepa','sepas','sepa','sepamos','sepáis','sepan'],ser:['sea','seas','sea','seamos','seáis','sean'],ver:['vea','veas','vea','veamos','veáis','vean'],caer:['caiga','caigas','caiga','caigamos','caigáis','caigan'],decir:['diga','digas','diga','digamos','digáis','digan'],hacer:['haga','hagas','haga','hagamos','hagáis','hagan'],poner:['ponga','pongas','ponga','pongamos','pongáis','pongan'],oír:['oiga','oigas','oiga','oigamos','oigáis','oigan'],salir:['salga','salgas','salga','salgamos','salgáis','salgan'],tener:['tenga','tengas','tenga','tengamos','tengáis','tengan'],traer:['traiga','traigas','traiga','traigamos','traigáis','traigan'],valer:['valga','valgas','valga','valgamos','valgáis','valgan'],venir:['venga','vengas','venga','vengamos','vengáis','vengan']};
const sentences=[['Ich möchte, dass du mir hilfst.','Quiero que me ayudes.'],['Es ist wichtig, dass wir die Wahrheit sagen.','Es importante que digamos la verdad.'],['Ich hoffe, dass sie keine Angst hat.','Espero que no tenga miedo.'],['Die Lehrerin möchte, dass wir lernen.','La profesora quiere que aprendamos.'],['Ich glaube nicht, dass er die Antwort weiß.','No creo que sepa la respuesta.'],['Wir wollen, dass die Polizei das Opfer verteidigt.','Queremos que la policía defienda a la víctima.'],['Es ist notwendig, dass ihr das Problem löst.','Es necesario que solucionéis el problema.'],['Ich hoffe, dass sie morgen kommen.','Espero que vengan mañana.'],['Sie möchte, dass ich die Wahrheit erzähle.','Ella quiere que cuente la verdad.'],['Es ist gut, dass du niemanden beleidigst.','Es bueno que no insultes a nadie.'],['Ich möchte nicht, dass du leidest.','No quiero que sufras.'],['Es ist wichtig, dass wir Mobbing verhindern.','Es importante que evitemos el acoso.']];
const readings=[{text:'Lucía tiene quince años y va al instituto. Desde hace algunas semanas, dos compañeros la insultan y la ignoran durante los recreos. Su amiga Elena se da cuenta del problema y habla con una profesora. La profesora quiere que todos los alumnos se sientan seguros. Organiza una conversación con la clase y pide que nadie se quede callado cuando vea una injusticia.',qs:[['¿Cuántos años tiene Lucía?','quince'],['¿Quién habla con una profesora?','Elena'],['¿Qué hacen dos compañeros durante los recreos?','La insultan y la ignoran'],['¿Qué quiere la profesora?','Que todos los alumnos se sientan seguros']]},{text:'Mateo ve que un compañero nuevo está solo en el patio. Algunos alumnos se ríen de él porque habla con otro acento. Mateo piensa que es injusto. Decide sentarse con el chico y escuchar su historia. Más tarde, los dos hablan con el tutor. El tutor propone que la clase prepare una campaña contra el acoso escolar.',qs:[['¿Dónde está solo el compañero nuevo?','En el patio'],['¿Por qué se ríen algunos alumnos?','Porque habla con otro acento'],['¿Con quién hablan los dos chicos?','Con el tutor'],['¿Qué propone el tutor?','Una campaña contra el acoso escolar']]}];
const listens=[{text:'Hola, soy Ana. Ayer vi que unos alumnos insultaban a Pablo. No dije nada porque tenía miedo. Hoy he hablado con mi profesora. Ella me ha dicho que es importante que todos ayudemos a las víctimas.',qs:[['¿A quién insultaban?','A Pablo'],['¿Por qué Ana no dijo nada?','Porque tenía miedo'],['¿Con quién ha hablado hoy?','Con su profesora']]},{text:'Buenos días. En nuestro instituto queremos evitar el acoso escolar. Si ves que alguien sufre, habla con un adulto de confianza. No queremos que ninguna persona se sienta sola.',qs:[['¿Qué quieren evitar en el instituto?','El acoso escolar'],['¿Con quién debes hablar?','Con un adulto de confianza'],['¿Cómo no quieren que se sienta nadie?','Solo o sola']]}];
const extraVocab=[['el medio ambiente','die Umwelt'],['el cambio climático','der Klimawandel'],['la contaminación','die Verschmutzung'],['reciclar','recyceln'],['ahorrar energía','Energie sparen'],['la igualdad','die Gleichberechtigung'],['la discriminación','die Diskriminierung'],['los derechos humanos','die Menschenrechte'],['la inmigración','die Einwanderung'],['la sociedad','die Gesellschaft'],['el futuro','die Zukunft'],['la experiencia','die Erfahrung'],['la ventaja','der Vorteil'],['la desventaja','der Nachteil'],['la opinión','die Meinung'],['estar de acuerdo','einverstanden sein'],['sin embargo','jedoch'],['aunque','obwohl'],['por eso','deshalb'],['la red social','das soziale Netzwerk'],['la privacidad','die Privatsphäre'],['la noticia','die Nachricht'],['la educación','die Bildung'],['la oportunidad','die Gelegenheit'],['mejorar','verbessern'],['proteger','schützen'],['participar','teilnehmen'],['compartir','teilen'],['desarrollar','entwickeln'],['la responsabilidad','die Verantwortung']];
const extraSentences=[['Obwohl es schwierig ist, müssen wir die Umwelt schützen.','Aunque sea difícil, tenemos que proteger el medio ambiente.'],['Ich glaube, dass soziale Netzwerke Vorteile und Nachteile haben.','Creo que las redes sociales tienen ventajas y desventajas.'],['Es ist wichtig, dass Jugendliche ihre Meinung sagen.','Es importante que los jóvenes expresen su opinión.'],['Wenn ich mehr Zeit hätte, würde ich Spanisch lernen.','Si tuviera más tiempo, estudiaría español.'],['Ich hoffe, dass die Situation sich verbessert.','Espero que la situación mejore.'],['Wir sollten weniger Plastik benutzen.','Deberíamos usar menos plástico.'],['Die Lehrerin bittet uns, dass wir pünktlich kommen.','La profesora nos pide que lleguemos a tiempo.'],['Als ich klein war, spielte ich oft im Park.','Cuando era pequeño, jugaba a menudo en el parque.'],['Gestern habe ich einen interessanten Artikel gelesen.','Ayer leí un artículo interesante.'],['Meiner Meinung nach ist Bildung sehr wichtig.','En mi opinión, la educación es muy importante.'],['Ich möchte in einem Land leben, in dem alle die gleichen Rechte haben.','Quiero vivir en un país donde todos tengan los mismos derechos.'],['Es ist möglich, dass es morgen regnet.','Es posible que llueva mañana.']];
const extraReadings=[{text:'En un instituto de Valencia, un grupo de estudiantes ha creado un proyecto para reducir los residuos. Cada clase separa el papel y el plástico. Además, los alumnos organizan una campaña para ahorrar agua y electricidad. Al principio, algunos compañeros pensaban que era una pérdida de tiempo. Sin embargo, después de tres meses, el instituto consume menos energía. La directora espera que otras escuelas sigan su ejemplo.',qs:[['¿Dónde está el instituto?','En Valencia'],['¿Qué materiales separan las clases?','El papel y el plástico'],['¿Qué pensaban algunos compañeros al principio?','Que era una pérdida de tiempo'],['¿Qué espera la directora?','Que otras escuelas sigan su ejemplo']]},{text:'Clara tiene dieciséis años y utiliza las redes sociales todos los días. Le gusta compartir fotos y hablar con sus amigos, pero últimamente se preocupa por su privacidad. Un día descubre que una foto suya ha sido publicada sin permiso. Habla con sus padres y decide cambiar la configuración de su cuenta. Ahora recomienda que sus amigos piensen antes de publicar información personal.',qs:[['¿Cuántos años tiene Clara?','Dieciséis'],['¿Qué le preocupa últimamente?','Su privacidad'],['¿Qué descubre un día?','Que una foto suya ha sido publicada sin permiso'],['¿Qué recomienda a sus amigos?','Que piensen antes de publicar información personal']]}];
const extraListens=[{text:'Hola, me llamo Diego. En mi ciudad hemos organizado una jornada sin coches. Muchas personas han ido al trabajo en bicicleta o en autobús. Creo que es importante que todos hagamos algo para proteger el medio ambiente.',qs:[['¿Cómo se llama el hablante?','Diego'],['¿Qué jornada han organizado?','Una jornada sin coches'],['¿Qué medios de transporte menciona?','La bicicleta y el autobús']]},{text:'Buenas tardes. Hoy hablamos con Sara, una estudiante que pasó seis meses en Chile. Al principio le costaba entender el acento, pero después hizo muchos amigos. Dice que viajar le ha ayudado a ser más independiente.',qs:[['¿En qué país pasó Sara seis meses?','En Chile'],['¿Qué le costaba al principio?','Entender el acento'],['¿En qué le ha ayudado viajar?','A ser más independiente']]}];
const topicOfVocab=['environment','environment','environment','environment','environment','society','society','society','society','society','travel','travel','society','society','society','society','society','society','society','social','social','social','society','travel','environment','environment','society','social','society','society'];
const topicOfSentences=['environment','social','society','travel','society','environment','travel','travel','travel','society','society','environment'];
function setTopics(on){document.querySelectorAll('#topics input').forEach(e=>e.checked=on)}
function selectedTopics(){return [...document.querySelectorAll('#topics input:checked')].map(e=>e.value)}
function choosePools(base,extra,extraTopics,selected){let pool=[];if(selected.includes('photos'))pool.push(...base);extra.forEach((item,i)=>{if(selected.includes(extraTopics[i]))pool.push(item)});return pool}
const STORAGE_KEY='spanisch10_mistakes_v1';
function loadMistakes(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}
function saveMistakes(x){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(x))}catch(e){}}
function taskKey(t,area){return area+'|'+t.q+'|'+t.a}
function updateStats(){let n=Object.keys(loadMistakes()).length;document.getElementById('memoryStats').textContent='📌 Gespeicherte Fehler: '+n+' · Bleiben auf diesem Gerät erhalten.'}
function clearMistakes(){if(confirm('Alle gespeicherten Fehler wirklich löschen?')){saveMistakes({});updateStats()}}
const subjects=['yo'  ,'tú','él / ella','nosotros','vosotros','ellos / ellas'];let tab='vocab',tasks=[],idx=0,score=0,attempt=0,results=[];const titles={vocab:'Vokabeln',grammar:'Subjuntivo',translate:'Sätze übersetzen',read:'Leseverstehen',listen:'Hörverstehen'};const tabs=document.getElementById('tabs');Object.entries(titles).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{tab=k;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');start()};b.dataset.tab=k;tabs.append(b)});tabs.firstChild.classList.add('active');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;]/g,'').replace(/\s+/g,' ').trim()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(){idx=0;score=0;attempt=0;results=[];let n=+document.getElementById('count').value,selected=selectedTopics();if(!selected.length){document.getElementById('work').innerHTML='<p class="bad">Bitte wähle mindestens ein Thema aus.</p>';return}const pick=(a,b,topics)=>choosePools(a,b,topics,selected);if(tab==='vocab')tasks=shuffle(pick(vocab,extraVocab,topicOfVocab)).slice(0,n).map(([es,de])=>Math.random()<.5?{q:'Übersetze ins Deutsche: '+es,a:de}:{q:'Übersetze ins Spanische: '+de,a:es});if(tab==='grammar'){let base=Object.entries(verbs).flatMap(([v,forms])=>forms.map((a,i)=>({q:`Bilde den presente de subjuntivo: ${v} – ${subjects[i]}`,a})));let more=[...base,{q:'Subjuntivo von hablar – nosotros',a:'hablemos'},{q:'Subjuntivo von vivir – ellos',a:'vivan'},{q:'Subjuntivo von pedir – tú',a:'pidas'},{q:'Subjuntivo von dormir – ella',a:'duerma'},{q:'Subjuntivo von empezar – yo',a:'empiece'},{q:'Subjuntivo von poder – nosotros',a:'podamos'},{q:'Subjuntivo von conocer – yo',a:'conozca'}];tasks=shuffle(pick(base,more.slice(base.length),["society","travel","society","travel","environment","society","society"])).slice(0,n)}if(tab==='translate')tasks=shuffle(pick(sentences,extraSentences,topicOfSentences)).slice(0,n).map(([q,a])=>({q:'Übersetze ins Spanische: '+q,a}));if(tab==='read'||tab==='listen'){let src=shuffle(pick(tab==='read'?readings:listens,tab==='read'?extraReadings:extraListens,tab==='read'?["environment","social"]:["environment","travel"]));tasks=src.flatMap((r,i)=>r.qs.map(([q,a],j)=>({q,a,text:r.text,group:i,first:j===0}))).slice(0,n)}if(document.getElementById('mode').value==='review'){let mistakes=loadMistakes();tasks=tasks.filter(t=>mistakes[taskKey(t,tab)]);if(!tasks.length){let all=Object.values(mistakes).filter(t=>t.area===tab);tasks=shuffle(all.map(x=>x.task)).slice(0,n)}}if(!tasks.length){document.getElementById('work').innerHTML='<p>Hier gibt es aktuell keine gespeicherten Fehler oder keine passenden Aufgaben. Starte zuerst eine normale Übungsrunde.</p>';updateStats();return}updateStats();render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Sprachausgabe auf diesem Gerät nicht verfügbar.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=+document.getElementById('speed').value;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}function render(){let w=document.getElementById('work');if(idx>=tasks.length){w.innerHTML=`<h2>Runde beendet 🎉</h2><p class="stat">${score} von ${tasks.length} Aufgaben beim ersten Versuch richtig</p><p>${results.map((r,i)=>`${i+1}. ${r?'✓':'✗'}`).join(' · ')}</p><details><summary>Musterlösungen anzeigen</summary>${tasks.map((t,i)=>`<p><strong>${i+1}. ${esc(t.q)}</strong><br>${esc(t.a)}</p>`).join('')}</details><button class="primary" onclick="start()">Neue Aufgaben</button>`;return}let t=tasks[idx],intro='';if(tab==='read')intro=`<h3>Lee el texto</h3><p lang="es" style="line-height:1.7">${esc(t.text)}</p>`;if(tab==='listen')intro=`<h3>Escucha el audio</h3><p class="muted">Höre aufmerksam zu. Der Text wird nicht angezeigt.</p><label>Tempo <select id="speed"><option value="0.75">Langsam</option><option value="0.9">Etwas langsamer</option><option value="1" selected>Normal</option></select></label><button onclick="speak(tasks[idx].text)">🔊 Audio abspielen</button>`;w.innerHTML=`<p class="muted">${esc(titles[tab])} · Aufgabe ${idx+1} von ${tasks.length}</p>${intro}<h3>${esc(t.q)}</h3><textarea id="answer" placeholder="Antwort hier eintippen …" autocomplete="off" autocapitalize="off"></textarea><div id="feedback" aria-live="polite"></div><button class="primary" id="check" onclick="check()">Überprüfen</button><button class="hidden" id="next" onclick="next()">Weiter →</button><p class="muted">Bei freien Sätzen sind sinngleiche Varianten möglich; die automatische Prüfung ist vereinfacht.</p>`}
function check(){let t=tasks[idx],v=document.getElementById('answer').value.trim();if(!v)return;let exact=norm(v)===norm(t.a);let fb=document.getElementById('feedback'),test=document.getElementById('mode').value==='test';if(attempt===0){results.push(exact);if(exact)score++;let mistakes=loadMistakes(),key=taskKey(t,tab);if(exact){delete mistakes[key]}else{mistakes[key]={area:tab,task:t,updated:Date.now()}}saveMistakes(mistakes);updateStats()}attempt++;if(test){fb.textContent='Antwort gespeichert.';document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');return}if(exact){let mistakes=loadMistakes();delete mistakes[taskKey(t,tab)];saveMistakes(mistakes);updateStats();fb.innerHTML='<p class="good">✓ Richtig! Diese Aufgabe ist nicht mehr in deiner Fehlerliste.</p>';document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden')}else if(attempt===1){fb.innerHTML='<p class="bad">Noch nicht richtig. Du hast einen zweiten Versuch.</p>'}else{fb.innerHTML=`<p class="bad">Musterlösung: <strong>${esc(t.a)}</strong></p>`;document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden')}}function next(){idx++;attempt=0;render()}start();</script></html>
